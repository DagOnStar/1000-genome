<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc">
  <title id="title">E4 DAGonStar evaluation duration</title>
  <desc id="desc">Horizontal bars compare task-type smoke, complete Batch workflow, and complete Slurm workflow durations in seconds.</desc>
  <style>
    .title{font:700 25px system-ui;fill:#0f172a}.sub{font:14px system-ui;fill:#475569}
    .label{font:600 16px system-ui;fill:#0f172a}.value{font:700 16px system-ui;fill:#0f172a}
    .grid{stroke:#cbd5e1;stroke-width:1}.tick{font:13px system-ui;fill:#64748b}
  </style>
  <rect width="1100" height="430" fill="#f8fafc"/>
  <text x="45" y="45" class="title">E4 evaluation duration</text>
  <text x="45" y="70" class="sub">fesrv.e4.cluster · 2026-11-15 · synthetic validation fixture · lower is faster</text>
  <line x1="315" y1="100" x2="315" y2="350" class="grid"/>
  <line x1="490" y1="100" x2="490" y2="350" class="grid"/>
  <line x1="665" y1="100" x2="665" y2="350" class="grid"/>
  <line x1="840" y1="100" x2="840" y2="350" class="grid"/>
  <line x1="1015" y1="100" x2="1015" y2="350" class="grid"/>
  <text x="310" y="375" class="tick">0</text><text x="485" y="375" class="tick">5</text>
  <text x="655" y="375" class="tick">10</text><text x="830" y="375" class="tick">15</text>
  <text x="1002" y="375" class="tick">20 s</text>
  <text x="45" y="145" class="label">Task-type smoke</text>
  <rect x="315" y="115" width="338" height="45" rx="8" fill="#db2777"/>
  <text x="670" y="144" class="value">9.652 s</text>
  <text x="45" y="235" class="label">Batch workflow</text>
  <rect x="315" y="205" width="377" height="45" rx="8" fill="#2563eb"/>
  <text x="709" y="234" class="value">10.773 s</text>
  <text x="45" y="325" class="label">Slurm workflow</text>
  <rect x="315" y="295" width="695" height="45" rx="8" fill="#16a34a"/>
  <text x="925" y="324" class="value" fill="#fff">19.867 s</text>
  <text x="45" y="407" class="sub">Slurm includes submission and allocation overhead; timings are not production-scale throughput claims.</text>
</svg>
